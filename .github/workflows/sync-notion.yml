name: Sync Notion catalog

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-notion.mjs'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/fetch-notion.mjs

      - name: Commit data/media.json if it changed
        run: |
          git config user.name "petalas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/media.json
          git diff --cached --quiet || git commit -m "chore: sync catalog from Notion"
          git push

      - name: Publish data/media.json to Neocities
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          curl -sSf -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F "data/media.json=@data/media.json" \
            https://neocities.org/api/upload
